<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Link na Bio</title>

<!-- Fontes (se não carregarem, cai em Georgia/sistema e continua elegante) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ============================================================
   PALETA — mundo "oncinha": areia, caramelo, cacau, café
   ============================================================ */
:root{
  --cream:    #F7F0E1;   /* cartão */
  --cream-hi: #FCF8EE;   /* brilho/anel da foto */
  --sand:     #D8B98A;   /* base da oncinha */
  --caramel:  #C4925C;   /* miolo das rosetas */
  --cocoa:    #6B4A2E;   /* botão principal / acento */
  --cocoa-dk: #543A24;
  --espresso: #3A2A1B;   /* texto + manchas da oncinha */
  --line:     #E7DcC4;

  --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --sans:  'Jost', 'Segoe UI', system-ui, -apple-system, sans-serif;
}

*{ box-sizing:border-box; margin:0; padding:0; }

html,body{ height:100%; }
body{
  font-family:var(--sans);
  color:var(--espresso);
  background:var(--sand);
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* Fundo oncinha gerado por JS (fica atrás de tudo) */
#leopard{
  position:fixed; inset:0; z-index:0;
  background:var(--sand);
}
#leopard svg{ display:block; width:100%; height:100%; }

/* ===== IMAGEM DE FUNDO =====================================
   Troque o nome do arquivo em --bg-img (deixe a imagem nesta mesma pasta).
   Para voltar ao fundo oncinha, troque por: none
   ============================================================ */
:root{ --bg-img: url("IMG_1309.JPG.jpeg"); }
#bg{
  position:fixed; inset:0; z-index:0;
  background-image:var(--bg-img);
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}
#bg::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(58,42,27,.28) 100%);
}
/* leve sombra nas bordas pra dar profundidade */
#leopard::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(58,42,27,.28) 100%);
}

/* ============================================================
   LAYOUT
   ============================================================ */
.wrap{
  position:relative; z-index:1;
  min-height:100dvh;
  display:flex; justify-content:center; align-items:flex-start;
  padding:96px 18px 40px;
}

.card{
  position:relative;
  width:100%; max-width:430px;
  background:var(--cream);
  border:1px solid rgba(255,255,255,.6);
  border-radius:30px;
  padding:96px 26px 30px;      /* espaço superior p/ a foto que vaza */
  box-shadow:0 34px 70px -22px rgba(48,32,20,.65),
             0 2px 0 rgba(255,255,255,.5) inset;
  text-align:center;
}

/* Tag estilo "REC" do modelo, mas na pegada dela */
.tag{
  position:absolute; top:78px; left:22px;
  display:inline-flex; align-items:center; gap:7px;
  background:var(--cocoa); color:var(--cream-hi);
  font-size:11px; font-weight:600; letter-spacing:.16em;
  padding:7px 13px; border-radius:11px;
  transform:rotate(-6deg);
  box-shadow:0 6px 14px -6px rgba(58,42,27,.7);
}
.tag .dot{ width:7px; height:7px; border-radius:50%; background:#E9C58A; }

/* Foto: círculo com anel creme que "vaza" pra cima, sobre a oncinha */
.photo{
  position:absolute; top:-92px; left:50%; transform:translateX(-50%);
  width:186px; height:186px; border-radius:50%;
  background:var(--cream-hi);
  padding:9px;
  box-shadow:0 20px 34px -14px rgba(48,32,20,.6);
}
.photo .frame{
  width:100%; height:100%; border-radius:50%;
  overflow:hidden;
  background:
    linear-gradient(160deg, #4a3526, #24170e);   /* fallback caso não tenha foto */
  display:grid; place-items:center;
}
.photo .frame img{ width:100%; height:100%; object-fit:cover; display:block; }
.photo .frame .ph{ color:#d8c3ab; font-size:12px; letter-spacing:.14em; text-transform:uppercase; }

.name{
  font-family:var(--serif);
  font-weight:600;
  font-size:clamp(34px, 10vw, 44px);
  line-height:1.02;
  letter-spacing:.01em;
}
.role{
  margin-top:12px;
  font-size:12.5px; font-weight:600;
  letter-spacing:.22em; text-transform:uppercase;
  color:var(--cocoa);
}
.role::before,.role::after{ content:"·"; margin:0 8px; color:var(--caramel); }

.tagline{
  margin:18px auto 0;
  max-width:300px;
  font-family:var(--serif); font-style:italic;
  font-size:18px; line-height:1.35;
  color:var(--espresso);
}
.tagline .spark{ color:var(--caramel); font-style:normal; }

/* ============================================================
   LINKS
   ============================================================ */
.links{ margin-top:28px; display:flex; flex-direction:column; gap:14px; }

.link{
  --bg:var(--cocoa); --fg:var(--cream-hi); --ic:rgba(255,255,255,.16);
  display:flex; align-items:center; gap:14px;
  text-decoration:none; color:var(--fg);
  background:var(--bg);
  border:1.5px solid var(--bg);
  border-radius:18px;
  padding:15px 18px;
  text-align:left;
  transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
  box-shadow:0 10px 22px -14px rgba(58,42,27,.9);
}
/* variação "vazada" (linhas alternadas, como no modelo) */
.link.ghost{
  --bg:transparent; --fg:var(--espresso); --ic:rgba(107,74,46,.10);
  border-color:var(--cocoa);
  box-shadow:none;
}
.link .ic{
  flex:0 0 auto; width:40px; height:40px; border-radius:12px;
  background:var(--ic); display:grid; place-items:center;
}
.link .ic svg{ width:21px; height:21px; fill:currentColor; }
.link .txt{ flex:1 1 auto; line-height:1.15; }
.link .txt b{ font-size:15.5px; font-weight:600; letter-spacing:.01em; }
.link .txt small{ display:block; font-size:12px; opacity:.72; margin-top:2px; letter-spacing:.02em; }
.link .arrow{ flex:0 0 auto; transition:transform .18s ease; opacity:.65; }
.link:hover{ transform:translateY(-2px); box-shadow:0 16px 26px -14px rgba(58,42,27,.85); }
.link.ghost:hover{ background:rgba(107,74,46,.06); }
.link:hover .arrow{ transform:translateX(4px); }
.link:active{ transform:translateY(0) scale(.99); }
.link:focus-visible{ outline:3px solid var(--caramel); outline-offset:3px; }

/* ============================================================
   RODAPÉ / LOGO
   ============================================================ */
.foot{ margin-top:26px; display:flex; flex-direction:column; align-items:center; gap:10px; }
.divider{ width:46px; height:1px; background:var(--line); position:relative; }
.divider::after{ content:"✦"; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
  color:var(--caramel); font-size:12px; background:var(--cream); padding:0 6px; }
.logo{ height:96px; display:grid; place-items:center; }
.logo img{ max-height:96px; max-width:260px; object-fit:contain; display:block; }
.logo .ph{
  font-family:var(--serif); font-style:italic; color:var(--caramel);
  font-size:13px; letter-spacing:.12em;
  border:1px dashed var(--line); padding:8px 16px; border-radius:12px;
}

/* ============================================================
   ANIMAÇÃO DE ENTRADA
   ============================================================ */
@keyframes rise{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }
@keyframes pop{ from{ opacity:0; transform:translateX(-50%) scale(.85); } to{ opacity:1; transform:translateX(-50%) scale(1); } }
.card{ animation:rise .6s .05s both cubic-bezier(.2,.7,.2,1); }
.photo{ animation:pop .6s .15s both cubic-bezier(.2,.7,.2,1); }
.tag,.name,.role,.tagline,.links,.foot{ animation:rise .55s both cubic-bezier(.2,.7,.2,1); }
.tag{ animation-delay:.30s } .name{ animation-delay:.24s } .role{ animation-delay:.30s }
.tagline{ animation-delay:.36s } .links{ animation-delay:.42s } .foot{ animation-delay:.5s }

@media (prefers-reduced-motion:reduce){
  *{ animation:none !important; transition:none !important; }
}
</style>
</head>
<body>

<div id="leopard"></div>
<div id="bg"></div>

<main class="wrap">
  <section class="card">

    <span class="tag"><span class="dot"></span>LASH</span>

    <!-- FOTO: troque o src do <img>. Sem foto, mostra o placeholder abaixo. -->
    <div class="photo">
      <div class="frame">
        <img src="foto.jpg" alt="foto">
        <!-- <span class="ph">Foto</span> -->
      </div>
    </div>

    <h1 class="name" id="name">Lívia Ribeiro</h1>
    <p class="role" id="role">Lash Designer</p>
    <p class="tagline"><span class="spark">✦</span> <span id="tagline">Seus olhos merecem destaque</span></p>

    <nav class="links" id="links" aria-label="Meus links"></nav>

    <div class="foot">
      <div class="divider"></div>
      <div class="logo">
        <img src="logo_marrom.png" alt="logo">
      </div>
    </div>

  </section>
</main>

<script>
/* ============================================================
   ▼▼▼  CONFIG — edite só isto  ▼▼▼
   ============================================================ */
const CONFIG = {
  nome:        "Lívia Ribeiro",                 // nome / marca dela
  cargo:       "Lash Designer",              // especialidade
  frase:       "Seus olhos merecem destaque",

  whatsapp:    "5511912389355",              // DDI + DDD + número (só dígitos)
  whatsappMsg: "Oi! Vim pelo seu link da bio 💛 quero agendar um horário",
  instagram:   "_.livialashdesigner",               // sem @
  tiktok:      "_.livialasdesigner",                  // sem @
};

/* Ícones (simple-icons) */
const ICON = {
  whats: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.885-9.885 9.885M20.52 3.449C18.24 1.245 15.24 0 12.045 0 5.463 0 .104 5.334.101 11.892c0 2.096.549 4.14 1.595 5.945L0 24l6.335-1.652a12.062 12.062 0 005.71 1.447h.006c6.585 0 11.946-5.335 11.949-11.893a11.821 11.821 0 00-3.484-8.413"/></svg>',
  insta: '<svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069M12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0m0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324M12 16a4 4 0 110-8 4 4 0 010 8m6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881"/></svg>',
  tiktok:'<svg viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>',
  arrow: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
};

/* Monta os 3 links (WhatsApp = CTA principal preenchido; IG e TikTok vazados) */
(function renderLinks(){
  const c = CONFIG;
  document.getElementById('name').textContent = c.nome;
  document.getElementById('role').textContent = c.cargo;
  document.getElementById('tagline').textContent = c.frase;

  const items = [
    { cls:'',      icon:ICON.whats,  b:'Agendar horário', s:'Chama no WhatsApp',
      href:`https://wa.me/${c.whatsapp}?text=${encodeURIComponent(c.whatsappMsg)}` },
    { cls:'ghost', icon:ICON.insta,  b:'Instagram', s:'@'+c.instagram,
      href:`https://instagram.com/${c.instagram}` },
    { cls:'ghost', icon:ICON.tiktok, b:'TikTok', s:'@'+c.tiktok,
      href:`https://tiktok.com/@${c.tiktok}` },
  ];
  document.getElementById('links').innerHTML = items.map(i => `
    <a class="link ${i.cls}" href="${i.href}" target="_blank" rel="noopener" aria-label="${i.b}">
      <span class="ic">${i.icon}</span>
      <span class="txt"><b>${i.b}</b><small>${i.s}</small></span>
      <span class="arrow">${ICON.arrow}</span>
    </a>`).join('');
})();

/* ============================================================
   ONCINHA GERADA — sem imagem, tudo em SVG
   ============================================================ */
const LEO = {
  cell: 78,                                   // densidade (menor = mais manchas)
  base:'#D8B98A',
  caramel:'#C4925C',
  spots:['#3A2A1B','#4A3320','#5A3E28'],      // tons das manchas p/ dar profundidade
  seed: 20260501,
};

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* spline fechada suave (Catmull-Rom -> Bézier) p/ manchas orgânicas */
function smooth(p){
  const n=p.length; let d=`M${p[0][0].toFixed(1)} ${p[0][1].toFixed(1)}`;
  for(let i=0;i<n;i++){
    const p0=p[(i-1+n)%n], p1=p[i], p2=p[(i+1)%n], p3=p[(i+2)%n];
    const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=`C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d+'Z';
}
function blob(cx,cy,r,irr,rnd,pts){
  const arr=[];
  for(let i=0;i<pts;i++){
    const a=(i/pts)*Math.PI*2;
    const rr=r*(1+(rnd()*2-1)*irr);
    arr.push([cx+Math.cos(a)*rr, cy+Math.sin(a)*rr]);
  }
  return smooth(arr);
}
/* uma roseta: miolo caramelo + anel quebrado de manchas escuras */
function rosette(cx,cy,R,rnd){
  let s=`<path d="${blob(cx,cy,R*0.6,0.34,rnd,7)}" fill="${LEO.caramel}" opacity="0.85"/>`;
  const count=5+Math.floor(rnd()*3);          // 5–7 clusters
  const rot=rnd()*Math.PI*2;
  for(let i=0;i<count;i++){
    if(rnd()<0.14) continue;                   // "quebra" o anel -> mais real
    const a=(i/count)*Math.PI*2+rot;
    const rad=R*(0.9+(rnd()*2-1)*0.14);
    const bx=cx+Math.cos(a)*rad+(rnd()*2-1)*R*0.14;
    const by=cy+Math.sin(a)*rad+(rnd()*2-1)*R*0.14;
    const bs=R*(0.30+rnd()*0.16);
    const col=LEO.spots[Math.floor(rnd()*LEO.spots.length)];
    s+=`<path d="${blob(bx,by,bs,0.45,rnd,6)}" fill="${col}"/>`;
    if(rnd()<0.3){                             // manchinha satélite
      const bx2=bx+(rnd()*2-1)*R*0.34, by2=by+(rnd()*2-1)*R*0.34;
      s+=`<path d="${blob(bx2,by2,bs*0.5,0.5,rnd,5)}" fill="${col}"/>`;
    }
  }
  return `<g>${s}</g>`;
}
function paintLeopard(){
  const el=document.getElementById('leopard');
  const w=window.innerWidth, h=window.innerHeight;
  const rnd=mulberry32(LEO.seed);
  const cell=LEO.cell;
  let body='';
  for(let y=-cell; y<h+cell; y+=cell){
    for(let x=-cell; x<w+cell; x+=cell){
      const jx=x+(rnd()*2-1)*cell*0.42;
      const jy=y+(rnd()*2-1)*cell*0.42;
      const R=cell*0.42*(0.78+rnd()*0.5);
      body+=rosette(jx,jy,R,rnd);
    }
  }
  el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice"
     xmlns="http://www.w3.org/2000/svg">
     <rect width="${w}" height="${h}" fill="${LEO.base}"/>${body}</svg>`;
}
paintLeopard();
let t; addEventListener('resize',()=>{ clearTimeout(t); t=setTimeout(paintLeopard,160); });
</script>
